<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Métro">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef2f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c111b" media="(prefers-color-scheme: dark)">
<title>Attente métro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout : une colonne. Titre et bouton d'actualisation, puis une carte par station avec, par direction, la pastille de ligne, la destination et un grand chiffre en minutes. */
:root {
  --bg: #eef2f6;
  --surface: #ffffff;
  --ink: #101828;
  --muted: #5b6778;
  --line: #e1e6ee;
  --accent: #1f4ed8;
  --on-accent: #ffffff;
  --crit: #b42318;
  --crit-bg: #fdecea;
  --warn: #8a5300;
  --warn-bg: #fff2d6;
  --soft-bg: #eef1f6;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 8px 24px rgba(16, 24, 40, .06);
  --font: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c111b; --surface: #151c2b; --ink: #eef2f8; --muted: #9aa6b8; --line: #243049;
    --accent: #7ea1ff; --on-accent: #0c111b; --crit: #ff8a80; --crit-bg: #3a1c1c;
    --warn: #ffc069; --warn-bg: #3a2c12; --soft-bg: #1d263a; --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c111b; --surface: #151c2b; --ink: #eef2f8; --muted: #9aa6b8; --line: #243049;
  --accent: #7ea1ff; --on-accent: #0c111b; --crit: #ff8a80; --crit-bg: #3a1c1c;
  --warn: #ffc069; --warn-bg: #3a2c12; --soft-bg: #1d263a; --shadow: none;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.45 var(--font);
  padding-inline: 16px;
  padding-block: calc(env(safe-area-inset-top, 0px) + 16px) calc(env(safe-area-inset-bottom, 0px) + 32px);
  -webkit-text-size-adjust: 100%;
}
main { max-width: 520px; margin-inline: auto; display: flex; flex-direction: column; gap: 16px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { min-width: 0; }
h1 { margin: 0; font-size: 28px; line-height: 1.1; font-weight: 800; letter-spacing: -.01em; }
.sub { margin: 3px 0 0; color: var(--muted); font-size: 14px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding-inline: 16px; border-radius: 12px; border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); font-weight: 700; flex-shrink: 0; }
.btn[disabled] { opacity: .6; cursor: default; }
.btn svg { width: 20px; height: 20px; flex: none; }
.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin svg { animation: none; } }
.alert { background: var(--warn-bg); color: var(--warn); border-radius: 12px; padding: 10px 14px; font-size: 14px; font-weight: 600; }
.alert[hidden] { display: none; }

#stations { display: flex; flex-direction: column; gap: 16px; transition: opacity .15s; }
#stations.busy { opacity: .55; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 16px 18px 12px; }
.card-head h2 { margin: 0; font-size: 20px; line-height: 1.2; font-weight: 800; min-width: 0; overflow-wrap: anywhere; }
.stamp { color: var(--muted); font-size: 13px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.dir { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 18px; border-top: 1px solid var(--line); }
.bullet { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-size: 21px; font-weight: 800; line-height: 1; }
.bullet.long { font-size: 11px; }
.dir-main { min-width: 0; }
.dir-label { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.dir-name { font-size: 18px; line-height: 1.2; font-weight: 700; overflow-wrap: anywhere; }
.later { margin-top: 3px; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.pill { border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 700; background: var(--soft-bg); color: var(--muted); }
.pill.late { background: var(--warn-bg); color: var(--warn); }
.dir-time { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.num { font-size: 40px; line-height: 1; font-weight: 800; letter-spacing: -.02em; }
.unit { font-size: 14px; color: var(--muted); font-weight: 700; margin-left: 3px; }
.dir-time.cancelled .num { font-size: 18px; color: var(--crit); letter-spacing: 0; }
.msg { margin: 0; padding: 14px 18px 18px; color: var(--muted); border-top: 1px solid var(--line); }
.msg.err { color: var(--crit); background: var(--crit-bg); border-top-color: transparent; }
.empty { padding: 20px 18px; display: flex; flex-direction: column; gap: 10px; }
.empty h2 { margin: 0; font-size: 20px; font-weight: 800; }
.empty p { margin: 0; color: var(--muted); }
.empty code { font-size: 14px; background: var(--soft-bg); padding: 1px 6px; border-radius: 6px; }
</style>
</head>
<body>
<main>
  <header class="top">
    <div class="brand">
      <h1>Métro</h1>
      <p class="sub" id="status">Chargement…</p>
    </div>
    <button class="btn" id="refreshBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>
      <span>Actualiser</span>
    </button>
  </header>
  <div class="alert" id="alert" hidden role="status"></div>
  <section id="stations" aria-live="polite"></section>
</main>

<script>
// =====================================================================
// CONFIGURATION : seul endroit à modifier.
// Renseignez « relay » (recommandé) OU « apiKey ».
//  - relay  : adresse de votre relais Cloudflare (la clé reste chez Cloudflare, jamais dans cette page).
//  - apiKey : clé PRIM écrite ici. Si le dépôt GitHub est public, toute personne qui ouvre le code de la page peut la lire.
// =====================================================================
const CONFIG = {
  relay: 'https://metro-relais.t-tribout.workers.dev',
  apiKey: '',
  autoRefreshSeconds: 120,   // 0 pour désactiver. Chaque actualisation coûte une requête par station.
  dailyLimit: 900,           // garde-fou par appareil (le quota PRIM est de 1 000 par jour pour un jeton récent)
  stations: [
    { label: 'Télégraphe', id: 'STIF:StopPoint:Q:21993:', dest: 'Châtelet' },
    { label: 'Belleville', id: 'STIF:StopPoint:Q:22128:', dest: 'Porte Dauphine' },
    { label: 'Anvers', id: 'STIF:StopArea:SP:22123:', dest: 'Nation' },
    { label: 'Anvers', id: 'STIF:StopArea:SP:463120:', dest: 'Nation' },
    { label: 'Belleville', id: 'STIF:StopArea:SP:463110:', dest: 'Rosny' }
  ]
};

// ---------- Fonctions pures (testées hors navigateur) ----------
// PURE-START
// Couleurs de lignes de métro (de mémoire, à corriger si besoin) et correspondance code IDFM -> numéro.
// Le numéro vient d'abord du nom publié par l'API ; la table de codes ne sert qu'en secours.
var LINE_COLORS = { '1': '#FFCE00', '2': '#0064B0', '3': '#9F9825', '3B': '#98D4E2', '4': '#C04191', '5': '#F28E42', '6': '#83C491', '7': '#F3A4BA', '7B': '#83C491', '8': '#CEADD2', '9': '#D5C900', '10': '#E3B32A', '11': '#8D5E2A', '12': '#00814F', '13': '#98D4E2', '14': '#662483' };
var CODE_TO_LINE = { 'C01371': '1', 'C01372': '2', 'C01373': '3', 'C01386': '3B', 'C01374': '4', 'C01375': '5', 'C01376': '6', 'C01377': '7', 'C01387': '7B', 'C01378': '8', 'C01379': '9', 'C01380': '10', 'C01381': '11', 'C01382': '12', 'C01383': '13', 'C01384': '14' };
function val(x) {
  if (x == null) return '';
  if (Array.isArray(x)) return val(x[0]);
  if (typeof x === 'object') return val(x.value !== undefined ? x.value : x.Value);
  return String(x);
}
function toDate(s) {
  if (!s) return null;
  // La doc PRIM indique des heures en GMT hors ResponseTimestamp.
  const str = /T\d\d:\d\d(:\d\d(\.\d+)?)?$/.test(s) ? s + 'Z' : s;
  const d = new Date(str);
  return isNaN(d) ? null : d;
}
function shortLine(ref) {
  const m = /Line::([^:]+):?/.exec(ref || '');
  return m ? m[1] : (ref || '?');
}
function normLine(s) {
  return String(s || '').trim().toUpperCase().replace(/^M(ETRO|ÉTRO)?\s*/, '').replace(/\s*BIS$/, 'B');
}
function lineLabel(published, ref) {
  const code = shortLine(ref);
  return normLine(published) || CODE_TO_LINE[code] || code;
}
function inkFor(hex) {
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? '#111111' : '#ffffff';
}
function parseVisits(json) {
  const out = [];
  let deliveries = json && json.Siri && json.Siri.ServiceDelivery && json.Siri.ServiceDelivery.StopMonitoringDelivery;
  if (!deliveries) return out;
  if (!Array.isArray(deliveries)) deliveries = [deliveries];
  for (const d of deliveries) {
    for (const v of (d.MonitoredStopVisit || [])) {
      const j = v.MonitoredVehicleJourney || {};
      const c = j.MonitoredCall || {};
      const expected = c.ExpectedDepartureTime || c.ExpectedArrivalTime || null;
      const aimed = c.AimedDepartureTime || c.AimedArrivalTime || null;
      const t = toDate(expected || aimed);
      if (!t) continue;
      const lineRef = val(j.LineRef);
      out.push({
        lineRef: lineRef,
        line: lineLabel(val(j.PublishedLineName), lineRef),
        dest: val(j.DestinationName) || val(c.DestinationDisplay) || val(j.DirectionName),
        time: t.getTime(),
        realtime: !!expected,
        status: val(c.DepartureStatus) || val(c.ArrivalStatus)
      });
    }
  }
  out.sort(function (a, b) { return a.time - b.time; });
  return out;
}
function groupVisits(visits, now) {
  const map = new Map();
  for (const v of visits) {
    if (v.time < now - 60000) continue; // passage déjà effectué
    const key = v.line + '|' + v.dest;
    if (!map.has(key)) map.set(key, { line: v.line, dest: v.dest, items: [] });
    map.get(key).items.push(v);
  }
  const groups = Array.from(map.values());
  for (const g of groups) {
    g.active = g.items.filter(function (i) { return i.status !== 'cancelled'; });
    g.first = (g.active[0] || g.items[0]).time;
  }
  groups.sort(function (a, b) { return a.first - b.first; });
  return groups;
}
function minutesUntil(ms, now) { return Math.floor((ms - now) / 60000); }
// Ignore accents, majuscules, espaces et tirets : « Rosny-Bois-Perrier » = « Rosny - Bois-Perrier ».
function fold(s) { return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
function matchDest(dest, filter) { const f = fold(filter).trim(); return !f || fold(dest).indexOf(f) !== -1; }
function makeSample(now) {
  const iso = function (m) { return new Date(now + m * 60000).toISOString(); };
  const visit = function (code, name, dest, m, status) {
    return { MonitoredVehicleJourney: {
      LineRef: { value: 'STIF:Line::' + code + ':' },
      PublishedLineName: [{ value: name }],
      DestinationName: [{ value: dest }],
      MonitoredCall: { ExpectedDepartureTime: iso(m), DepartureStatus: status || 'onTime' }
    } };
  };
  return { Siri: { ServiceDelivery: { StopMonitoringDelivery: [{ MonitoredStopVisit: [
    visit('C01381', '11', 'Châtelet', 2), visit('C01381', '11', 'Châtelet', 7), visit('C01381', '11', 'Châtelet', 12),
    visit('C01381', '11', 'Rosny - Bois-Perrier', 1), visit('C01381', '11', 'Rosny - Bois-Perrier', 5, 'delayed'),
    visit('C01372', '2', 'Porte Dauphine', 4), visit('C01372', '2', 'Porte Dauphine', 9),
    visit('C01372', '2', 'Nation', 3), visit('C01372', '2', 'Nation', 8, 'cancelled')
  ] }] } } };
}
// PURE-END

// ---------- Compteur de requêtes (par appareil) ----------
function dayKey() { return 'metro.count.' + new Date().toLocaleDateString('fr-CA', { timeZone: 'Europe/Paris' }); }
function getCount() { try { return parseInt(localStorage.getItem(dayKey()) || '0', 10) || 0; } catch (e) { return 0; } }
function addCount(n) { try { localStorage.setItem(dayKey(), String(getCount() + n)); } catch (e) {} }
function hhmm(ms) { return new Date(ms).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Paris' }); }

// ---------- Réseau ----------
const PRIM = 'https://prim.iledefrance-mobilites.fr/marketplace/stop-monitoring';
let data = {};          // id -> { visits, fetchedAt, error }
let lastFetch = 0;
let busy = false;
const demo = location.hash === '#exemple';   // aperçu avec des données fictives : ajouter #exemple à l'adresse

async function fetchStation(id) {
  const relay = (CONFIG.relay || '').trim();
  const url = (relay || PRIM) + '?MonitoringRef=' + encodeURIComponent(id);
  const headers = { Accept: 'application/json' };
  if (!relay) headers.apikey = (CONFIG.apiKey || '').trim();
  addCount(1);
  let res;
  try { res = await fetch(url, { headers: headers }); }
  catch (e) { return { error: relay ? "Le relais ne répond pas. Vérifiez son adresse et l'origine autorisée." : "Appel bloqué par le navigateur ou réseau coupé. Passez par un relais." }; }
  if (res.status === 401 || res.status === 403) return { error: "Clé refusée, ou l'API « Prochains passages (requête unitaire) » n'est pas souscrite sur cette clé." };
  if (res.status === 404) return { error: "Identifiant d'arrêt introuvable." };
  if (res.status === 429) return { error: "Quota de requêtes dépassé." };
  if (!res.ok) return { error: "Réponse inattendue (code " + res.status + ")." };
  let json;
  try { json = await res.json(); } catch (e) { return { error: "Réponse illisible." }; }
  return { visits: parseVisits(json), fetchedAt: Date.now() };
}

async function refresh() {
  if (busy) return;
  if (demo) { render(); return; }
  if (!CONFIG.relay.trim() && !CONFIG.apiKey.trim()) { render(); return; }
  if (getCount() + CONFIG.stations.length > CONFIG.dailyLimit) { setStatus('Limite du jour atteinte'); render(); return; }
  busy = true; setBusy(true); setStatus('Actualisation…');
  await Promise.all(CONFIG.stations.map(async function (s) { data[s.id] = await fetchStation(s.id); }));
  lastFetch = Date.now();
  busy = false; setBusy(false);
  setStatus('Mis à jour à ' + hhmm(lastFetch));
  render();
}

// ---------- Affichage ----------
const $ = function (s) { return document.querySelector(s); };
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function setStatus(t) { $('#status').textContent = t; }
function setBusy(b) {
  $('#refreshBtn').disabled = b;
  $('#refreshBtn').classList.toggle('spin', b);
  $('#stations').classList.toggle('busy', b);
}

function bullet(line) {
  const b = el('div', 'bullet' + (line.length > 3 ? ' long' : ''), line.replace(/B$/, 'bis'));
  const c = LINE_COLORS[line];
  b.style.background = c || '#667085';
  b.style.color = c ? inkFor(c) : '#ffffff';
  b.setAttribute('role', 'img');
  b.setAttribute('aria-label', 'Ligne ' + line);
  return b;
}

function directionRow(g, now) {
  const row = el('div', 'dir');
  row.appendChild(bullet(g.line));

  const main = el('div', 'dir-main');
  main.appendChild(el('div', 'dir-label', 'Direction'));
  main.appendChild(el('div', 'dir-name', g.dest || 'Inconnue'));
  const f = g.active[0];
  if (f) {
    const next = g.active.slice(1, 3).map(function (i) { return Math.max(0, minutesUntil(i.time, now)); });
    if (next.length) main.appendChild(el('div', 'later', 'Puis ' + next.join(' · ') + ' min'));
    const pills = el('div', 'pills');
    if (f.status === 'delayed') pills.appendChild(el('span', 'pill late', 'Retard'));
    if (!f.realtime) pills.appendChild(el('span', 'pill', 'Horaire théorique'));
    if (pills.childNodes.length) main.appendChild(pills);
  }
  row.appendChild(main);

  const t = el('div', 'dir-time' + (f ? '' : ' cancelled'));
  if (!f) {
    t.appendChild(el('span', 'num', 'Supprimé'));
  } else {
    const m = minutesUntil(f.time, now);
    if (m >= 60) t.appendChild(el('span', 'num', hhmm(f.time)));
    else {
      t.appendChild(el('span', 'num', m < 1 ? '<1' : String(m)));
      t.appendChild(el('span', 'unit', 'min'));
    }
  }
  row.appendChild(t);
  return row;
}

function stationCard(label, entry, now, stamp, destFilter) {
  const card = el('article', 'card');
  const head = el('header', 'card-head');
  head.appendChild(el('h2', null, label));
  head.appendChild(el('span', 'stamp', stamp));
  card.appendChild(head);
  if (!entry) { card.appendChild(el('p', 'msg', 'Chargement…')); return card; }
  if (entry.error) { card.appendChild(el('p', 'msg err', entry.error)); return card; }
  const groups = groupVisits(entry.visits, now).filter(function (g) { return matchDest(g.dest, destFilter); });
  if (!groups.length) {
    card.appendChild(el('p', 'msg', destFilter
      ? 'Aucun passage annoncé vers « ' + destFilter + ' ». Le service est peut-être terminé, ou le temps réel n\'est pas disponible sur cet arrêt.'
      : 'Aucun passage annoncé. Le service est peut-être terminé, ou le temps réel n\'est pas disponible sur cet arrêt.'));
    return card;
  }
  for (const g of groups) card.appendChild(directionRow(g, now));
  return card;
}

function configCard() {
  const card = el('article', 'card');
  const box = el('div', 'empty');
  box.appendChild(el('h2', null, 'Configuration à terminer'));
  const p1 = el('p', null, 'Ouvrez index.html sur GitHub, puis renseignez ');
  p1.appendChild(el('code', null, 'relay'));
  p1.appendChild(document.createTextNode(' (adresse du relais, recommandé) ou '));
  p1.appendChild(el('code', null, 'apiKey'));
  p1.appendChild(document.createTextNode(' dans le bloc CONFIG, en haut du script.'));
  box.appendChild(p1);
  box.appendChild(el('p', null, 'Pour voir l\'affichage en attendant, ajoutez #exemple à la fin de l\'adresse.'));
  card.appendChild(box);
  return card;
}

function render() {
  const box = $('#stations');
  box.replaceChildren();
  const now = Date.now();
  const alertEl = $('#alert');
  alertEl.hidden = true;
  if (demo) {
    const e = { visits: parseVisits(makeSample(now)), fetchedAt: now };
    setStatus('Données fictives');
    box.appendChild(stationCard('Télégraphe', e, now, 'Exemple', ''));
    return;
  }
  if (!CONFIG.relay.trim() && !CONFIG.apiKey.trim()) {
    setStatus('Non configuré');
    box.appendChild(configCard());
    return;
  }
  if (getCount() + CONFIG.stations.length > CONFIG.dailyLimit) {
    alertEl.textContent = 'Limite de requêtes atteinte sur cet appareil pour aujourd\'hui. Reprise demain.';
    alertEl.hidden = false;
  }
  for (const s of CONFIG.stations) {
    const e = data[s.id];
    box.appendChild(stationCard(s.label, e, now, e && e.fetchedAt ? hhmm(e.fetchedAt) : '', s.dest));
  }
}

// ---------- Démarrage ----------
$('#refreshBtn').addEventListener('click', refresh);
render();
refresh();
if (CONFIG.autoRefreshSeconds > 0 && !demo) {
  setInterval(function () { if (document.visibilityState === 'visible') refresh(); }, CONFIG.autoRefreshSeconds * 1000);
}
// Les minutes se décomptent sans nouvelle requête.
setInterval(function () { if (document.visibilityState === 'visible') render(); }, 15000);
// En revenant sur l'app, actualiser si les données ont plus d'une minute.
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState !== 'visible') return;
  if (Date.now() - lastFetch > 60000) refresh(); else render();
});
</script>
</body>
</html>
